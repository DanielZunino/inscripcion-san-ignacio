<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Inscripción Colaboradores San Ignacio</title>
<style>
:root{--m:#5b3f8c;--m2:#f3effa;--fondo:#efeaf6;--m3:#e3dcef;--b:#c9bfdc;--d:#bdb5cb;--rgb:91,63,140;--v:#1e8e3e;--r:#c5221f;--g:#5f6368}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:#202124}
.caja{max-width:540px;margin:0 auto;min-height:100vh;background:#fff;padding:0 16px 40px}
.top{position:sticky;top:0;background:#fff;padding:12px 0 10px;z-index:5;border-bottom:1px solid #eee}
.logo{display:block;margin:4px auto 6px;max-width:170px;max-height:60px;width:auto;height:auto}
.emp{text-align:center;font-size:14px;font-weight:bold;color:var(--m)}
.sec{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--g);margin-top:8px}
.barra{height:10px;background:var(--m3);border-radius:5px;overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;background:var(--m);width:0;transition:width .3s}
.preg{font-size:23px;font-weight:bold;margin:22px 0 6px;line-height:1.25}
.ayuda{font-size:16px;color:var(--g);margin:0 0 16px;line-height:1.35}
.oir{background:var(--m2);border:0;border-radius:20px;padding:8px 14px;font-size:15px;color:var(--m);margin-bottom:14px}
input[type=text],input[type=tel],input[type=email],input[type=date],select,textarea{width:100%;font-size:22px;padding:14px 12px;border:3px solid var(--b);border-radius:12px;outline:none;background:#fff;font-family:inherit;color:#202124}
textarea{min-height:110px}
input.ok,textarea.ok,select.ok{border-color:var(--v);background:#eef8f0}
input.mal,textarea.mal{border-color:var(--r);background:#fdeeee}
.tel{display:flex;gap:8px;align-items:center}.tel span{font-size:22px;font-weight:bold;white-space:nowrap}
.ops{display:grid;gap:10px}
.ops.c2{grid-template-columns:1fr 1fr}.ops.c3{grid-template-columns:1fr 1fr 1fr}.ops.c4{grid-template-columns:repeat(4,1fr)}
.op{font-size:19px;padding:16px 10px;border:3px solid var(--b);border-radius:14px;background:#fff;color:#202124;text-align:center;font-family:inherit;line-height:1.2}
.op.sel{border-color:var(--m);background:var(--m);color:#fff;font-weight:bold}
.op.dest{border-color:var(--m)}
.sub{font-size:15px;color:var(--g);margin:14px 0 8px;font-weight:bold}
.tres{display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:8px}.tres label{font-size:15px;color:var(--g);display:block;margin-bottom:4px}
.estado{min-height:30px;font-size:18px;font-weight:bold;margin:12px 0 4px;padding:0 2px}
.estado.ok{color:var(--v)}.estado.mal{color:var(--r)}.estado.info{color:var(--m)}
.pie{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;font-size:21px;font-weight:bold;padding:17px 8px;border:0;border-radius:14px;background:var(--m);color:#fff;font-family:inherit}
.btn:disabled{background:var(--d)}
.btn.sec2{flex:0 0 32%;background:#fff;color:var(--m);border:3px solid var(--m)}
.alt{display:block;width:100%;margin-top:10px;font-size:18px;padding:13px;border:2px dashed var(--m);background:#fff;color:var(--m);border-radius:12px;font-family:inherit}
.foto{border:3px dashed var(--b);border-radius:14px;padding:14px;margin-bottom:14px;text-align:center}
.foto.ok{border-color:var(--v);background:#eef8f0}
.foto h3{margin:0 0 4px;font-size:20px;color:var(--m)}.foto p{margin:0 0 8px;font-size:15px;color:var(--g)}
.foto svg{display:block;margin:0 auto 8px}.foto img{display:block;max-width:100%;max-height:170px;margin:0 auto 8px;border-radius:8px}
.foto label{display:inline-block;font-size:19px;font-weight:bold;padding:13px 16px;border-radius:12px;background:var(--m);color:#fff}
.foto input{display:none}
.res{border:2px solid var(--m3);border-radius:12px;padding:4px 12px;margin-bottom:10px}
.res div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eee;font-size:16px}
.res div:last-child{border:0}.res b{color:var(--g);font-weight:normal}.res span{text-align:right;font-weight:bold}
.res a{color:var(--m);font-size:14px;margin-left:6px}
.fin{text-align:center;padding:40px 6px}.fin .ic{font-size:72px}.fin h2{color:var(--v);font-size:26px}
.creado{text-align:center;font-size:12px;color:#80868b;margin-top:30px}
[hidden]{display:none!important}
.op.chk{display:flex;align-items:center;gap:14px;text-align:left;padding:18px 14px;width:100%;height:auto!important;flex:none!important;min-height:0}
.op.chk .tick{display:block;flex:none;width:46px;height:46px;box-sizing:border-box;align-self:center;border:4px solid var(--m);border-radius:10px;background:#fff;color:var(--m);font-size:34px;line-height:38px;text-align:center;font-weight:bold;animation:lat 1.2s infinite}
.op.chk.sel .tick{animation:none}
.op.chk .ctx{flex:1}
@keyframes lat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.op small{display:block;font-size:14px;font-weight:normal;margin-top:5px;opacity:.85;line-height:1.3}
.btn.va{animation:pulso 1.3s infinite}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(var(--rgb),.55)}50%{box-shadow:0 0 0 12px rgba(var(--rgb),0)}}
.voz{border:2px solid var(--m);background:#fff;color:var(--m);border-radius:20px;padding:4px 12px;font-size:14px;font-family:inherit}
.voz.off{border-color:var(--d);color:var(--g)}
.guia{font-size:17px;color:var(--m);font-weight:bold;text-align:center;margin-top:8px}
</style>
</head>

function dv(c) { let s = 0, m = 2; for (let i = c.length - 1; i >= 0; i--) { s += Number(c[i]) * m; m = m === 7 ? 2 : m + 1; } const r = 11 - (s % 11); return r === 11 ? '0' : r === 10 ? 'K' : String(r); }

function pintar() {
  const V = visibles();
  if (pos >= V.length) pos = V.length - 1;
  const s = V[pos];
  $('secT').textContent = s.sec <= 10 ? 'Paso ' + s.sec + ' de 10 · ' + SECS[s.sec] : SECS[s.sec];
  $('barra').style.width = Math.round(100 * pos / (V.length - 1)) + '%';
  let h = '<div class="preg">' + s.t + '</div>';
  if (s.h) h += '<p class="ayuda">' + s.h + '</p>';
  h += '<button class="oir" id="oir">🔊 Escuchar</button>';
  h += '<div id="campo"></div><div class="estado" id="est"></div>';
  h += '<div class="pie">' + (pos > 0 ? '<button class="btn sec2" id="atras">← Atrás</button>' : '') + '<button class="btn" id="sig">' + (s.tipo === 'resumen' ? 'Enviar ✅' : 'Siguiente ➜') + '</button></div><div class="guia" id="guia"></div>';
  app.innerHTML = h;
  $('oir').onclick = () => hablar(s.t + '. ' + (s.h || ''), true);
  hablar(s.t + '. ' + (s.h || ''));
  if ($('atras')) $('atras').onclick = () => { pos--; pintar(); };

// ---------- fotos ----------
// Recorte del carnet/licencia: busca el rectangulo del documento, lo endereza y lo deja proporcional (85,6 x 54 mm).
// Si no lo encuentra con seguridad, devuelve null y la foto queda como esta (nunca se corta mal).
function recorteCV(img) {
  if (!window.cv || !cv.Mat) return null;
  const k = Math.min(1, 800 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const borrar = []; const M = x => { borrar.push(x); return x; };
  let best = null;
  try {
    const src = M(cv.imread(c)), rgb = M(new cv.Mat()), gray = M(new cv.Mat()), hsv = M(new cv.Mat()), ch = M(new cv.MatVector());
    cv.cvtColor(src, rgb, cv.COLOR_RGBA2RGB); cv.cvtColor(rgb, gray, cv.COLOR_RGB2GRAY); cv.cvtColor(rgb, hsv, cv.COLOR_RGB2HSV); cv.split(hsv, ch);
    const canales = [gray, M(ch.get(1)), M(ch.get(2))], A = c.width * c.height, ker = M(cv.Mat.ones(3, 3, cv.CV_8U));
    for (const m of canales) {
      const g = M(new cv.Mat()); cv.GaussianBlur(m, g, new cv.Size(5, 5), 0);
      for (const [lo, hi] of [[20, 60], [40, 120], [75, 200]]) {
        const e = M(new cv.Mat()), cs = M(new cv.MatVector()), jer = M(new cv.Mat());
        cv.Canny(g, e, lo, hi); cv.dilate(e, e, ker, new cv.Point(-1, -1), 2);
        cv.findContours(e, cs, jer, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
        for (let i = 0; i < cs.size(); i++) {
          const ct = cs.get(i), a = cv.contourArea(ct);
          if (a >= 0.12 * A && a <= 0.97 * A) {
            const r = cv.minAreaRect(ct), w = r.size.width, h = r.size.height;
            if (Math.min(w, h) > 0) {
              const ar = Math.max(w, h) / Math.min(w, h), fill = a / (w * h);
              if (ar > 1.4 && ar < 1.8 && fill > 0.85 && (!best || a * fill > best.sc)) best = { sc: a * fill, pts: cv.RotatedRect.points(r) };
            }
          }
          ct.delete();
        }
      }
    }
  } catch (x) { best = null; } finally { borrar.forEach(x => { try { x.delete(); } catch (y) {} }); }
  if (!best) return null;
  // esquinas en orden: arriba-izq, arriba-der, abajo-der, abajo-izq (en la foto original)
  const P = best.pts.map(p => [p.x / k, p.y / k]);
  const s = P.map(p => p[0] + p[1]), d = P.map(p => p[1] - p[0]);
  const ix = (arr, f) => arr.indexOf(f(...arr));
  let q = [P[ix(s, Math.min)], P[ix(d, Math.min)], P[ix(s, Math.max)], P[ix(d, Math.max)]];
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  if (dist(q[0], q[1]) < dist(q[0], q[3])) q = [q[1], q[2], q[3], q[0]];   // documento vertical: se gira
  const W = 1400, H = Math.round(W / 1.586);
  const k2 = Math.min(1, 2400 / Math.max(img.width, img.height));
  const c2 = document.createElement('canvas'); c2.width = Math.round(img.width * k2); c2.height = Math.round(img.height * k2);
  c2.getContext('2d').drawImage(img, 0, 0, c2.width, c2.height);
  const out = document.createElement('canvas');
  const b2 = [];
  try {
    const src = cv.imread(c2); b2.push(src);
    const de = cv.matFromArray(4, 1, cv.CV_32FC2, [].concat(...q.map(p => [p[0] * k2, p[1] * k2]))); b2.push(de);
    const a = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, W, 0, W, H, 0, H]); b2.push(a);
    const T = cv.getPerspectiveTransform(de, a); b2.push(T);
    const dst = new cv.Mat(); b2.push(dst);
    cv.warpPerspective(src, dst, T, new cv.Size(W, H), cv.INTER_LINEAR, cv.BORDER_REPLICATE, new cv.Scalar());
    cv.imshow(out, dst);
  } catch (x) { return null; } finally { b2.forEach(x => { try { x.delete(); } catch (y) {} }); }
  return out.toDataURL('image/jpeg', 0.88);
}

// OpenCV (para enderezar el documento) se carga solo cuando se llega a las fotos
function cargarCV() { if (window._cvCarga) return; window._cvCarga = 1; const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js'; s.async = true; document.head.appendChild(s); }
function achicar(file) {
  return new Promise((ok, mal) => {
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(img.src);
      try { const r = recorteCV(img); if (r) { URL.revokeObjectURL(img.src); ok(r); return; } } catch (x) { /* sigue con el recorte simple */ }
      // recorte automatico del documento (se deja proporcional, nunca se estira)
      let x0 = 0, y0 = 0, w0 = img.width, h0 = img.height;
      try {
        const K = Math.min(1, 360 / Math.max(img.width, img.height)), W = Math.max(8, Math.round(img.width * K)), H = Math.max(8, Math.round(img.height * K));
        const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
        const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, W, H);
        const px = cx.getImageData(0, 0, W, H).data, g = new Float32Array(W * H);
        for (let i = 0; i < W * H; i++) g[i] = px[i * 4] * 0.299 + px[i * 4 + 1] * 0.587 + px[i * 4 + 2] * 0.114;
        const e = new Float32Array(W * H); let s = 0, s2 = 0, n = 0;

          const i = y * W + x, v = Math.abs(g[i + 1] - g[i - 1]) + Math.abs(g[i + W] - g[i - W]);

        for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) if (e[y * W + x] > t) { col[x]++; row[y]++; tot++; }
        const corte = (a, p) => { let acc = 0; for (let i = 0; i < a.length; i++) { acc += a[i]; if (acc >= tot * p) return i; } return a.length - 1; };
        if (tot > 50) {
          let a = corte(col, 0.01), b = corte(col, 0.99), c = corte(row, 0.01), d = corte(row, 0.99);
          const pw = (b - a) * 0.05, ph = (d - c) * 0.05;
          a = Math.max(0, a - pw); b = Math.min(W, b + pw); c = Math.max(0, c - ph); d = Math.min(H, d + ph);
          const area = (b - a) * (d - c) / (W * H);
          if (area > 0.2 && area < 0.97) { x0 = a / K; y0 = c / K; w0 = (b - a) / K; h0 = (d - c) / K; }
        }
      } catch (x) { x0 = 0; y0 = 0; w0 = img.width; h0 = img.height; }
      const k = Math.min(1, 1600 / Math.max(w0, h0));
      const c = document.createElement('canvas'); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
      c.getContext('2d').drawImage(img, x0, y0, w0, h0, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => mal(new Error('img'));
    img.src = URL.createObjectURL(file);
  });
}
